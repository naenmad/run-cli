[package]
name = "run"
version = "0.3.0"
edition = "2024"
description = "Lightning-fast, intuitive productivity CLI utility with dual-mode interaction and developer workflows"
repository = "https://github.com/naenmad/run-cli"
homepage = "https://github.com/naenmad/run-cli"
license = "MIT"
readme = "README.md"
keywords = ["cli", "productivity", "developer-tools", "terminal", "workflow"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
colored = "2.1"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
fuzzy-matcher = "0.3.7"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strsim = "0.11"
toml = "0.8"
