name: Feature Request
description: Suggest an idea or new productivity command for run-cli
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please check DESIGN.md for our naming conventions (full semantic verb + 3-letter alias).
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or daily workflow bottleneck?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution & Command Syntax
      description: Describe the feature, suggested command name, 3-letter alias, and how it should behave in both direct and interactive modes.
      placeholder: |
        - Command Name: `mycommand`
        - 3-Letter Alias: `myc`
        - Direct usage: `run mycommand <arg>`
        - Interactive behavior: prompt for `<arg>` if omitted
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or CLI examples here.
