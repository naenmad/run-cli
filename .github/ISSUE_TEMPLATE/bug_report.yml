name: Bug Report
description: Report a reproducible problem or unexpected behavior in run-cli
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check existing issues first before submitting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Run 'run port 8080'
        2. Enter option '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Details about your system setup.
      value: |
        - OS: macOS (e.g. Sonoma 14.6, Sequoia 15.0)
        - Architecture: Apple Silicon (M-series) / Intel (x86_64)
        - Terminal: (e.g. Terminal.app, iTerm2, Ghostty, Alacritty)
        - Shell: zsh / bash / fish
        - `run --version`:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Logs
      description: Paste any relevant terminal output, error messages, or screenshots.
      render: shell
