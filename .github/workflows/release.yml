name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13 # Intel macOS
            target: x86_64-apple-darwin
            artifact_name: run-macos-x86_64.tar.gz
          - os: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
            artifact_name: run-macos-aarch64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/run package/
          cp README.md package/
          cp LICENSE package/
          cd package
          tar -czf ../${{ matrix.artifact_name }} run README.md LICENSE
          cd ..
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
